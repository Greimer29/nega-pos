# =============================================================================
# Nega POS — Railway config-as-code (API service ONLY)
#
# Railway project must contain ONLY:
#   1. nega-pos-mysql  (Database plugin)
#   2. nega-pos-api    (this service)
#
# Do NOT deploy apps/web, desktop or mobile on Railway — they run 100% local.
# Guide: docs/RAILWAY_DEPLOY.md  |  Env: apps/api/.env.railway.example
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Multi-tenant: pre-deploy migrates central, then every company DB (nega_pos_t_*).
# New companies still get CREATE DATABASE + migrate + seed at provision time.
# If any tenant fails, exit ≠ 0 and Railway aborts promoting the new API.
preDeployCommand = "node ace migration:run_central --force && node ace migration:run_tenants --force"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Seed: entrypoint runs db:bootstrap → platform:bootstrap (super admin).
# Uploads: Volume /data/uploads + STORAGE_LOCAL_PATH=/data/uploads (paths prefixed by tenant).
# MySQL user must be able to CREATE DATABASE for new companies.
