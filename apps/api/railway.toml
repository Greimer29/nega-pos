# =============================================================================
# Nega POS — Railway config-as-code (API service ONLY)
#
# Railway project must contain ONLY:
#   1. nega-pos-mysql  (Database plugin)
#   2. nega-pos-api    (this service)
#
# Do NOT deploy apps/web, desktop or mobile on Railway — they run 100% local.
# Guide: docs/RAILWAY_DEPLOY.md  |  Env: apps/api/.env.railway.example
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
preDeployCommand = "node ace migration:run --force"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Migrations: preDeployCommand runs on every deploy (`node ace migration:run --force`),
# including `1750000000020_create_incomes_table` for the incomes hub.
# Seed: entrypoint runs db:bootstrap only if users table is empty.
# Uploads: attach Volume mount /data/uploads + STORAGE_LOCAL_PATH=/data/uploads
# (Volumes are NOT declared here — use Railway dashboard or CLI).
